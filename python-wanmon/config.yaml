# wanmon configuration
site_name: "Head Office"

fortigate:
  host: 192.168.1.99            # FortiGate management IP reachable from this machine
  port: 443                     # HTTPS admin port (change if you moved it, e.g. 8443)
  api_token: "${WANMON_FGT_TOKEN}"   # read from environment variable; or paste the key here
  verify_ssl: false             # false for the default self-signed cert, or a path to a CA bundle
  # vdom: root                  # uncomment only if VDOMs are enabled
  health_check: "WAN_SLA"       # name of your SD-WAN Performance SLA; remove to use all of them
  timeout: 10

links:
  - interface: wan1             # SD-WAN member interface name exactly as on the FortiGate
    name: "ISP-A"               # friendly name used in alerts
  - interface: wan2
    name: "ISP-B"
    # thresholds:               # optional per-link override, e.g. an LTE/microwave link
    #   latency_ms: 250

thresholds:
  latency_ms: 150               # above -> DEGRADED
  jitter_ms: 30                 # above -> DEGRADED
  loss_pct: 3                   # at/above -> DEGRADED
  loss_down_pct: 50             # at/above -> treated as DOWN

monitor:
  poll_seconds: 15
  raise_after: 3                # consecutive bad polls before alerting (3 x 15s = 45s)
  clear_after: 4                # consecutive good polls before declaring recovery
  reminder_minutes: 30          # re-alert while a link stays bad; 0 disables reminders
  api_fail_alert_after: 4       # alert if the FortiGate API is unreachable this many polls
  db_path: wanmon.db
  retention_days: 90
  log_file: wanmon.log

alerts:
  telegram:
    enabled: false
    bot_token: "${WANMON_TG_TOKEN}"
    chat_id: "123456789"        # your user ID or a group chat ID

  email:
    enabled: false
    smtp_host: smtp.office365.com
    smtp_port: 587
    starttls: true
    use_ssl: false              # true for port 465
    username: alerts@yourcompany.com
    password: "${WANMON_SMTP_PASSWORD}"
    from: alerts@yourcompany.com
    to: [you@yourcompany.com]

  teams:
    enabled: false
    webhook_url: "https://..."  # Teams Workflows "post to channel when webhook request is received"

  slack:
    enabled: false
    webhook_url: "https://hooks.slack.com/services/..."
